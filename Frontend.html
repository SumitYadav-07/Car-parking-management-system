<!DOCTYPE html>
<html>
<head>
    <title>Car Parking Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background: #222;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .hidden {
            display: none;
        }

        .slot-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .slot {
            padding: 15px;
            text-align: center;
            border-radius: 5px;
            cursor: pointer;
        }

        .available {
            background: #c8f7c5;
        }

        .occupied {
            background: #ffb5b5;
            cursor: not-allowed;
        }

        .selected {
            background: #70a1ff;
            color: white;
        }

        .message {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        .success {
            background: #c8f7c5;
        }

        .error {
            background: #ffb5b5;
        }

        .top-buttons {
            display: flex;
            gap: 10px;
        }

        .top-buttons button {
            width: 50%;
        }

        #amount {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>Car Parking Management System</h1>
</header>

<div class="container">

    <div id="loginPage" class="card">
        <h2>Login</h2>

        <div id="loginMessage"></div>

        <input type="text" id="loginUsername" placeholder="Username">
        <input type="password" id="loginPassword" placeholder="Password">

        <button onclick="login()">Login</button>

        <button onclick="showRegister()">Create Account</button>
    </div>

    <div id="registerPage" class="card hidden">
        <h2>Registration</h2>

        <div id="registerMessage"></div>

        <input type="text" id="registerUsername" placeholder="Username">
        <input type="password" id="registerPassword" placeholder="Password">

        <button onclick="register()">Register</button>

        <button onclick="showLogin()">Back to Login</button>
    </div>

    <div id="bookingPage" class="card hidden">
        <h2>Book Parking Slot</h2>

        <p>Logged in as: <b id="currentUser"></b></p>

        <div id="bookingMessage"></div>

        <h3>Select Slot</h3>

        <div id="slots" class="slot-container"></div>

        <h3>Parking Hours</h3>

        <input
            type="number"
            id="hours"
            min="1"
            value="1"
            onchange="calculateAmount()"
        >

        <p>Amount:</p>
        <p id="amount">₹50</p>

        <button onclick="bookSlot()">Book Slot</button>

        <button onclick="logout()">Logout</button>
    </div>

    <div id="paymentPage" class="card hidden">
        <h2>Payment</h2>

        <div id="paymentMessage"></div>

        <p>Booking ID:</p>
        <p id="bookingId"></p>

        <p>Slot:</p>
        <p id="bookingSlot"></p>

        <p>Amount:</p>
        <p id="bookingAmount"></p>

        <button onclick="makePayment()">Payment Done</button>

        <button onclick="cancelPayment()">Cancel</button>
    </div>

    <div id="adminPage" class="card hidden">
        <h2>Admin Dashboard</h2>

        <div id="adminMessage"></div>

        <p>Total Slots: <b id="totalSlots"></b></p>
        <p>Available Slots: <b id="availableSlots"></b></p>
        <p>Occupied Slots: <b id="occupiedSlots"></b></p>

        <div id="adminSlots" class="slot-container"></div>

        <button onclick="logout()">Logout</button>
    </div>

</div>

<script>
    let selectedSlot = null;
    let currentBookingId = null;

    function showLogin() {
        document.getElementById("loginPage").classList.remove("hidden");
        document.getElementById("registerPage").classList.add("hidden");
        document.getElementById("bookingPage").classList.add("hidden");
        document.getElementById("paymentPage").classList.add("hidden");
        document.getElementById("adminPage").classList.add("hidden");
    }

    function showRegister() {
        document.getElementById("loginPage").classList.add("hidden");
        document.getElementById("registerPage").classList.remove("hidden");
    }

    async function register() {
        const username = document.getElementById("registerUsername").value;
        const password = document.getElementById("registerPassword").value;

        const response = await fetch("/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body:
                "username=" + encodeURIComponent(username) +
                "&password=" + encodeURIComponent(password)
        });

        const data = await response.json();

        if (response.ok) {
            showMessage("registerMessage", data.message, true);
            setTimeout(showLogin, 1000);
        } else {
            showMessage("registerMessage", data.message, false);
        }
    }

    async function login() {
        const username = document.getElementById("loginUsername").value;
        const password = document.getElementById("loginPassword").value;

        const response = await fetch("/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body:
                "username=" + encodeURIComponent(username) +
                "&password=" + encodeURIComponent(password)
        });

        const data = await response.json();

        if (!response.ok) {
            showMessage("loginMessage", data.message, false);
            return;
        }

        localStorage.setItem("username", data.username);
        localStorage.setItem("role", data.role);

        if (data.role === "admin") {
            showAdmin();
        } else {
            showBooking();
        }
    }

    function showBooking() {
        document.getElementById("loginPage").classList.add("hidden");
        document.getElementById("registerPage").classList.add("hidden");
        document.getElementById("paymentPage").classList.add("hidden");
        document.getElementById("adminPage").classList.add("hidden");
        document.getElementById("bookingPage").classList.remove("hidden");

        document.getElementById("currentUser").textContent =
            localStorage.getItem("username");

        loadSlots();
    }

    async function loadSlots() {
        const response = await fetch("/slots");
        const slots = await response.json();

        const container = document.getElementById("slots");
        container.innerHTML = "";

        slots.sort((a, b) => a.slot.localeCompare(b.slot));

        slots.forEach(item => {
            const div = document.createElement("div");

            div.textContent = item.slot;
            div.classList.add("slot");

            if (item.occupied) {
                div.classList.add("occupied");
            } else {
                div.classList.add("available");

                div.onclick = function() {
                    selectSlot(item.slot, div);
                };
            }

            container.appendChild(div);
        });
    }

    function selectSlot(slot, element) {
        selectedSlot = slot;

        document.querySelectorAll(".slot").forEach(item => {
            item.classList.remove("selected");
        });

        element.classList.add("selected");
    }

    function calculateAmount() {
        const hours = Number(document.getElementById("hours").value);

        if (hours > 0) {
            document.getElementById("amount").textContent =
                "₹" + (hours * 50);
        }
    }

    async function bookSlot() {
        if (!selectedSlot) {
            showMessage(
                "bookingMessage",
                "Please select a parking slot",
                false
            );
            return;
        }

        const hours = Number(document.getElementById("hours").value);
        const username = localStorage.getItem("username");

        if (!hours || hours <= 0) {
            showMessage(
                "bookingMessage",
                "Please enter valid parking hours",
                false
            );
            return;
        }

        const response = await fetch("/book", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body:
                "username=" + encodeURIComponent(username) +
                "&slot=" + encodeURIComponent(selectedSlot) +
                "&hours=" + encodeURIComponent(hours)
        });

        const data = await response.json();

        if (!response.ok) {
            showMessage("bookingMessage", data.message, false);
            loadSlots();
            return;
        }

        currentBookingId = data.bookingId;

        document.getElementById("bookingId").textContent =
            data.bookingId;

        document.getElementById("bookingSlot").textContent =
            data.slot;

        document.getElementById("bookingAmount").textContent =
            "₹" + data.amount;

        document.getElementById("bookingPage").classList.add("hidden");
        document.getElementById("paymentPage").classList.remove("hidden");
    }

    async function makePayment() {
        const response = await fetch("/payment", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body:
                "bookingId=" +
                encodeURIComponent(currentBookingId)
        });

        const data = await response.json();

        if (!response.ok) {
            showMessage("paymentMessage", data.message, false);
            return;
        }

        showMessage(
            "paymentMessage",
            "Payment successful. Slot " + data.slot + " is booked.",
            true
        );

        setTimeout(() => {
            selectedSlot = null;
            currentBookingId = null;
            showBooking();
        }, 1500);
    }

    function cancelPayment() {
        showBooking();
    }

    function showAdmin() {
        document.getElementById("loginPage").classList.add("hidden");
        document.getElementById("registerPage").classList.add("hidden");
        document.getElementById("bookingPage").classList.add("hidden");
        document.getElementById("paymentPage").classList.add("hidden");
        document.getElementById("adminPage").classList.remove("hidden");

        loadAdminSlots();
    }

    async function loadAdminSlots() {
        const response = await fetch("/slots");
        const slots = await response.json();

        let occupied = 0;

        const container = document.getElementById("adminSlots");
        container.innerHTML = "";

        slots.sort((a, b) => a.slot.localeCompare(b.slot));

        slots.forEach(item => {
            const div = document.createElement("div");

            div.textContent = item.slot;
            div.classList.add("slot");

            if (item.occupied) {
                occupied++;
                div.classList.add("occupied");
            } else {
                div.classList.add("available");
            }

            container.appendChild(div);
        });

        document.getElementById("totalSlots").textContent =
            slots.length;

        document.getElementById("occupiedSlots").textContent =
            occupied;

        document.getElementById("availableSlots").textContent =
            slots.length - occupied;
    }

    function logout() {
        localStorage.removeItem("username");
        localStorage.removeItem("role");

        selectedSlot = null;
        currentBookingId = null;

        showLogin();
    }

    function showMessage(id, message, success) {
        const element = document.getElementById(id);

        element.textContent = message;
        element.className =
            "message " + (success ? "success" : "error");
    }

    calculateAmount();
</script>

</body>
</html>
